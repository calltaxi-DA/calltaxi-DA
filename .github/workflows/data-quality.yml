name: Reviewed data quality

on:
  pull_request:
    paths:
      - 'analysis/**'
      - 'src/data_quality.py'
      - 'src/tests/**'
      - 'backend/**'
      - 'ai/**'
      - 'frontend/src/**'
      - 'data/processed/region_*medical.csv'
      - 'notebooks_region_facilities/**'
      - 'docs/validation/**'
      - '.github/workflows/data-quality.yml'
  push:
    branches: ['analysis/phase9-*']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Audit committed exports (untracked originals reported as unverified)
        run: python -m src.data_quality --check-report docs/validation/phase9-audit-2026-09-13.json
      - name: Summarize CI validation scope
        run: |
          {
            echo "Committed export validation: PASSED"
            echo "Independent original-source comparison: NOT RUN IN CI"
            echo "Reason: raw/processed original source files are not all committed; missing originals are reported as not_verified_source_missing."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate data, providers and service contracts
        run: PYTHONPATH=backend:. python -m pytest src/tests backend/tests ai/tests
